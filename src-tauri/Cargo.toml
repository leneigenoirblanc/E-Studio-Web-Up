[package]
name = "e-studio"
version = "1.0.0"
description = "E-Studio Retail & Industrial Label Production Suite"
authors = ["E-Studio Team"]
license = "MIT"
edition = "2021"

[lib]
name = "e_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
